services:
  gpu-hot:
    image: ${GPU_HOT_IMAGE:?GPU_HOT_IMAGE must name the loaded immutable image}
    container_name: ${GPU_HOT_CONTAINER_NAME:-gpu-hot-node}
    init: true
    pid: host
    restart: unless-stopped
    ports:
      - "${GPU_HOT_BIND_ADDRESS:-0.0.0.0}:${GPU_HOT_PORT:-1312}:1312"
    environment:
      NODE_NAME: ${NODE_NAME:?NODE_NAME must identify this node}
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      NVIDIA_DRIVER_CAPABILITIES: ${NVIDIA_DRIVER_CAPABILITIES:-compute,utility}
      NVIDIA_DISABLE_REQUIRE: ${NVIDIA_DISABLE_REQUIRE:-1}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:1312/api/gpu-data"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
