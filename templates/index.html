<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPU Hot</title>
    <meta name="description"
        content="Real-time NVIDIA GPU monitoring dashboard — temperature, utilization, memory, power and more">
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">

    <!-- External Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Application Styles (modular) -->
    <link rel="stylesheet" href="/static/css/tokens.css">
    <link rel="stylesheet" href="/static/css/layout.css">
    <link rel="stylesheet" href="/static/css/components.css">
    <script src="/static/js/settings.js"></script>
</head>

<body>
    <div class="studio">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-logo">GPU</div>

            <nav class="sidebar-nav" id="view-selector">
                <button class="sidebar-btn active" data-view="overview" onclick="switchToView('overview')"
                    title="All GPUs">All</button>
            </nav>

            <div class="sidebar-bottom">
                <!-- System info -->
                <div class="system-info">
                    <div class="system-metric">
                        <canvas class="system-metric-chart" id="cpu-chart"></canvas>
                        <div class="system-metric-value" id="cpu-usage">0%</div>
                        <div class="system-metric-label">CPU</div>
                    </div>
                    <div class="system-metric">
                        <canvas class="system-metric-chart" id="memory-chart"></canvas>
                        <div class="system-metric-value" id="memory-usage">0%</div>
                        <div class="system-metric-label">RAM</div>
                    </div>
                </div>

                <!-- GitHub link -->
                <a href="https://github.com/psalias2006/gpu-hot" target="_blank" rel="noopener noreferrer"
                    class="sidebar-link" title="GitHub">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                        <path
                            d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z" />
                    </svg>
                </a>

                <button class="sidebar-link settings-button" id="settings-open" type="button"
                    aria-label="Open settings" aria-controls="settings-panel" aria-expanded="false" title="Settings">
                    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path d="M19.4 15a1.7 1.7 0 000 1.9l.1.1-2.5 2.5-.1-.1a1.7 1.7 0 00-1.9 0 1.7 1.7 0 00-1 1.6v.2h-4V21a1.7 1.7 0 00-1-1.6 1.7 1.7 0 00-1.9 0l-.1.1L4.5 17l.1-.1a1.7 1.7 0 000-1.9A1.7 1.7 0 003 14H2.8v-4H3a1.7 1.7 0 001.6-1 1.7 1.7 0 000-1.9L4.5 7 7 4.5l.1.1a1.7 1.7 0 001.9 0A1.7 1.7 0 0010 3v-.2h4V3a1.7 1.7 0 001 1.6 1.7 1.7 0 001.9 0l.1-.1L19.5 7l-.1.1a1.7 1.7 0 000 1.9 1.7 1.7 0 001.6 1h.2v4H21a1.7 1.7 0 00-1.6 1z"></path>
                    </svg>
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main">
            <div class="header" id="dashboard-status-home">
                <div class="header-row" id="connection-details">
                    <div class="header-status">
                        <div class="status-dot" id="status-dot"></div>
                        <span id="connection-status">Connecting</span>
                    </div>
                    <div class="version-info" id="version-info">
                        <span id="version-current"></span>
                        <span class="update-badge" id="update-badge" style="display: none;">
                            <a href="#" id="update-link" target="_blank" rel="noopener noreferrer">Update</a>
                        </span>
                    </div>
                </div>
            </div>

            <!-- Overview Tab -->
            <div id="tab-overview" class="tab-content active">
                <div id="overview-container" class="overview-grid">
                    <div class="loading">
                        <div class="loading-dot"></div>
                        <span>Waiting for GPU data…</span>
                    </div>
                </div>
            </div>

            <!-- Individual GPU Tabs (dynamically created) -->

            <!-- Processes -->
            <div class="processes-section">
                <div class="processes-header" onclick="toggleProcesses()">
                    <div class="processes-title">Processes</div>
                    <div class="processes-toggle">
                        <span id="process-count">0</span>
                        <span class="toggle-icon">&#9660;</span>
                    </div>
                </div>
                <div class="processes-content" id="processes-content">
                    <div class="processes-inner" id="processes-container">
                        <div class="loading">
                            <div class="loading-dot"></div>
                            <span>Loading processes…</span>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Chart detail drawer -->
    <div class="drawer-overlay" id="drawer-overlay"></div>
    <div class="drawer" id="chart-drawer">
        <div class="drawer-header">
            <div class="drawer-header-left">
                <span class="drawer-title" id="drawer-title">Chart</span>
                <div class="drawer-hero" id="drawer-hero">
                    <span class="drawer-hero-value" id="drawer-hero-value">--</span>
                    <span class="drawer-hero-unit" id="drawer-hero-unit"></span>
                </div>
            </div>
            <button class="drawer-close" id="drawer-close" aria-label="Close">&times;</button>
        </div>
        <div class="drawer-body">
            <div class="drawer-chart-wrap">
                <canvas id="drawer-chart-canvas"></canvas>
            </div>
            <div class="drawer-companions" id="drawer-companions"></div>
            <div class="drawer-stats-bar" id="drawer-stats"></div>
        </div>
    </div>

    <div class="settings-overlay" id="settings-overlay" hidden></div>
    <aside class="settings-panel" id="settings-panel" role="dialog" aria-modal="true"
        aria-labelledby="settings-title" aria-hidden="true" inert hidden>
        <div class="settings-header">
            <div class="settings-header-main">
                <h2 id="settings-title" class="settings-visually-hidden">Settings</h2>
                <button class="settings-close" id="settings-close" type="button" aria-label="Close settings">&times;</button>
            </div>
            <div class="settings-connection-details" id="settings-connection-details" hidden></div>
        </div>
        <div class="settings-body">
            <section class="settings-group" aria-labelledby="settings-general-title">
                <h3 id="settings-general-title">General</h3>
                <label class="settings-row settings-row-select" for="settings-theme">
                    <span>Theme</span>
                    <select id="settings-theme">
                        <option value="default">Default</option>
                        <option value="midnight">Midnight</option>
                        <option value="high-contrast">High contrast</option>
                    </select>
                </label>
                <label class="settings-option settings-check-row" for="settings-move-connection-details">
                    <input id="settings-move-connection-details" type="checkbox">
                    <span>Move connection details into this panel</span>
                </label>
            </section>
            <section class="settings-group" aria-labelledby="settings-metrics-title">
                <h3 id="settings-metrics-title">All page metrics</h3>
                <p class="settings-note settings-note-under-heading">Drag to reorder</p>
                <div class="settings-subgroup settings-metric-list">
                    <label class="settings-check-row"><input type="checkbox" data-overview-setting="utilization"> Utilization</label>
                    <label class="settings-check-row"><input type="checkbox" data-overview-setting="temperature"> Temperature</label>
                    <label class="settings-check-row"><input type="checkbox" data-overview-setting="memory"> Memory</label>
                    <label class="settings-check-row"><input type="checkbox" data-overview-setting="power"> Power</label>
                    <label class="settings-check-row settings-chart-row"><input type="checkbox" data-overview-setting="chart"> Mini chart</label>
                    <label class="settings-check-row"><input type="checkbox" data-overview-setting="fan-speed"> Fan speed</label>
                    <label class="settings-check-row"><input type="checkbox" data-overview-setting="graphics-clock"> Graphics clock</label>
                    <label class="settings-check-row"><input type="checkbox" data-overview-setting="memory-clock"> Memory clock</label>
                    <label class="settings-check-row"><input type="checkbox" data-overview-setting="memory-used"> Memory used in GB</label>
                    <label class="settings-check-row"><input type="checkbox" data-overview-setting="power-limit"> Power limit</label>
                    <label class="settings-check-row"><input type="checkbox" data-overview-setting="memory-temperature"> Memory temperature</label>
                    <label class="settings-check-row"><input type="checkbox" data-overview-setting="throttle-status"> Throttle status</label>
                    <label class="settings-check-row"><input type="checkbox" data-overview-setting="process-count"> Process count</label>
                    <label class="settings-check-row"><input type="checkbox" data-overview-setting="pcie-generation"> PCIe generation</label>
                    <label class="settings-check-row"><input type="checkbox" data-overview-setting="pcie-width"> PCIe width</label>
                    <label class="settings-check-row"><input type="checkbox" data-overview-setting="encoder-load"> Encoder load</label>
                    <label class="settings-check-row"><input type="checkbox" data-overview-setting="decoder-load"> Decoder load</label>
                    <label class="settings-check-row"><input type="checkbox" data-overview-setting="performance-state"> Performance state</label>
                    <label class="settings-check-row"><input type="checkbox" data-overview-display="showModel"> Show model</label>
                    <label class="settings-check-row"><input type="checkbox" data-overview-display="showCardId"> Show card ID</label>
                </div>
                <div class="settings-subgroup settings-subgroup-after">
                    <label class="settings-row settings-row-select" for="settings-overview-chart-width">
                        <span>Mini chart width</span>
                        <select id="settings-overview-chart-width">
                            <option value="auto">Automatic</option>
                            <option value="wide">Wide</option>
                            <option value="full">Full row</option>
                            <option value="behind">Behind metrics</option>
                        </select>
                    </label>
                    <label class="settings-row settings-row-slider" id="settings-overview-chart-behind-dim-field" for="settings-overview-chart-behind-dim" hidden>
                        <span>Opacity</span>
                        <span class="settings-range-row">
                            <input id="settings-overview-chart-behind-dim" type="range" min="10" max="100" step="1" value="25">
                            <output id="settings-overview-chart-behind-dim-value" for="settings-overview-chart-behind-dim">25%</output>
                        </span>
                    </label>
                </div>
            </section>
            <section class="settings-group" aria-labelledby="settings-leftbar-title">
                <h3 id="settings-leftbar-title">Left bar</h3>
                <label class="settings-row settings-row-select" for="settings-sidebar-width">
                    <span>Width</span>
                    <select id="settings-sidebar-width">
                        <option value="standard">Standard</option>
                        <option value="comfortable">Comfortable</option>
                        <option value="wide">Wide</option>
                    </select>
                </label>
                <label class="settings-option settings-check-row">
                    <input id="settings-sidebar-auto-hide" type="checkbox">
                    <span>Hide the left bar when not in use</span>
                </label>
            </section>
            <section class="settings-group" aria-labelledby="settings-labels-title">
                <h3 id="settings-labels-title">Names</h3>
                <label class="settings-row settings-row-select" for="settings-sidebar-label">
                    <span>GPU name style</span>
                    <select id="settings-sidebar-label">
                        <option value="index">Index</option>
                        <option value="node-index">Node and index</option>
                        <option value="short-name">Short name</option>
                    </select>
                </label>
                <div class="settings-label-list" id="settings-label-list"></div>
            </section>
            <section class="settings-group" aria-labelledby="settings-notices-title">
                <h3 id="settings-notices-title">Event notices</h3>
                <label class="settings-check-row"><input type="checkbox" data-notice-setting="noticeGpuThrottle"> GPU throttling</label>
                <label class="settings-check-row"><input type="checkbox" data-notice-setting="noticeGpuMissing"> GPU missing</label>
                <label class="settings-check-row"><input type="checkbox" data-notice-setting="noticeNodeOffline"> Node offline</label>
                <label class="settings-check-row"><input type="checkbox" data-notice-setting="noticeExternalFanStopped"> External fan stopped</label>
            </section>
            <button class="settings-reset" id="settings-reset" type="button">Reset settings</button>
            <p class="settings-status" id="settings-status" role="status" aria-live="polite"></p>
        </div>
    </aside>

    <section class="event-notices" id="event-notices" role="log" aria-live="polite"
        aria-label="Event notices" hidden>
        <div class="event-notices-header">
            <h2>Event notices</h2>
            <button type="button" id="event-notices-clear">Clear all</button>
        </div>
        <div id="event-notices-list"></div>
    </section>

    <!-- Star toast -->
    <div class="star-toast is-hidden" id="star-toast" role="status" aria-live="polite">
        <button class="star-toast-close" type="button" data-action="dismiss" aria-label="Close">&times;</button>
        <div class="star-toast-title">Star on GitHub</div>
        <div class="star-toast-text">Help others discover GPU Hot</div>
        <div class="star-toast-progress-wrap is-hidden" id="star-progress-wrap">
            <div class="star-toast-progress-bar">
                <div class="star-toast-progress-fill" id="star-progress-fill"></div>
            </div>
            <div class="star-toast-milestone" id="star-toast-milestone"></div>
        </div>
        <button class="star-toast-btn" type="button" data-action="star">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor">
                <path
                    d="M8 .25a.75.75 0 01.673.418l1.882 3.815 4.21.612a.75.75 0 01.416 1.279l-3.046 2.97.719 4.192a.75.75 0 01-1.088.791L8 12.347l-3.766 1.98a.75.75 0 01-1.088-.79l.72-4.194L.818 6.374a.75.75 0 01.416-1.28l4.21-.611L7.327.668A.75.75 0 018 .25z" />
            </svg>
            Star
        </button>
    </div>

    <!-- Application Scripts -->
    <script src="/static/js/chart-config.js"></script>
    <script src="/static/js/chart-manager.js"></script>
    <script src="/static/js/gpu-cards.js"></script>
    <script src="/static/js/ui.js"></script>
    <script src="/static/js/event-notices.js"></script>
    <script src="/static/js/socket-handlers.js"></script>
    <script src="/static/js/chart-drawer.js"></script>
    <script src="/static/js/app.js"></script>
</body>

</html>
